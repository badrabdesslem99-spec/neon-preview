<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معاينة النيون - NEON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
        body {
            background: #121212;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px;
            min-height: 100vh;
            color: #fff;
        }
        h1 { font-size: 22px; margin-bottom: 14px; color: #ff66b2; text-shadow: 0 0 10px #ff66b280; }
        .upload-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 520px;
            margin-bottom: 14px;
        }
        .upload-btn {
            background: #2a2a2a;
            padding: 11px 14px;
            border-radius: 30px;
            border: 1px solid #444;
            color: #ddd;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
            text-align: center;
            transition: 0.2s;
            display: block;
        }
        .upload-btn:active { background: #3a3a3a; }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            aspect-ratio: 4 / 3;
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #333;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            touch-action: none;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .controls {
            width: 100%;
            max-width: 520px;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e1e1e;
            padding: 7px 12px;
            border-radius: 30px;
            border: 1px solid #333;
        }
        .slider-row label {
            min-width: 55px;
            font-size: 12px;
            color: #aaa;
        }
        .slider-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            background: #333;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ff66b2;
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-row span {
            min-width: 36px;
            text-align: center;
            font-size: 13px;
            color: #fff;
        }
        .blend-row, .flip-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .blend-btn, .flip-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            flex: 1;
            min-width: 70px;
            text-align: center;
            transition: 0.2s;
        }
        .blend-btn.active, .flip-btn.active {
            background: #ff66b2;
            color: #121212;
            border-color: #ff66b2;
            font-weight: bold;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            flex: 1;
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); background: #3a3a3a; }
        .btn-primary { background: #ff66b2; color: #121212; border: none; }
        .btn-primary:active { background: #ff88c2; }
        .info { font-size: 11px; color: #666; margin-top: 10px; text-align: center; line-height: 1.4; }
        .hidden-input { display: none; }
        .section-title {
            font-size: 12px;
            color: #888;
            margin: 2px 0 2px 4px;
        }
    </style>
</head>
<body>

    <h1>🧬 NEON · معاينة فورية</h1>

    <div class="upload-section">
        <label class="upload-btn" for="bgInput">📸 صورة المحل</label>
        <input type="file" id="bgInput" class="hidden-input" accept="image/*">

        <label class="upload-btn" for="neonInput">💡 صورة النيون</label>
        <input type="file" id="neonInput" class="hidden-input" accept="image/*">
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">

        <div class="slider-row">
            <label>📐 الحجم</label>
            <input type="range" id="scaleSlider" min="0.15" max="2.5" step="0.01" value="0.8">
            <span id="scaleVal">0.80</span>
        </div>

        <div class="slider-row">
            <label>🔄 الدوران</label>
            <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
            <span id="rotateVal">0°</span>
        </div>

        <div class="slider-row">
            <label>✨ الشفافية</label>
            <input type="range" id="alphaSlider" min="0.2" max="1.0" step="0.01" value="0.95">
            <span id="alphaVal">0.95</span>
        </div>

        <div class="slider-row">
            <label>☀️ السطوع</label>
            <input type="range" id="brightnessSlider" min="0.4" max="2.2" step="0.05" value="1.0">
            <span id="brightnessVal">1.00</span>
        </div>

        <div class="slider-row">
            <label>◐ التباين</label>
            <input type="range" id="contrastSlider" min="0.5" max="2.0" step="0.05" value="1.0">
            <span id="contrastVal">1.00</span>
        </div>

        <div class="section-title">نوع المزج (جربهم حسب نوع النيون)</div>
        <div class="blend-row">
            <div class="blend-btn active" data-blend="screen">Screen</div>
            <div class="blend-btn" data-blend="lighten">Lighten</div>
            <div class="blend-btn" data-blend="soft-light">Soft Light</div>
        </div>

        <div class="section-title">قلب النيون</div>
        <div class="flip-row">
            <div class="flip-btn" id="flipH">↔ أفقي</div>
            <div class="flip-btn" id="flipV">↕ عمودي</div>
        </div>

        <div class="action-buttons">
            <div class="btn" id="resetBtn">↺ إعادة تعيين</div>
            <div class="btn btn-primary" id="saveBtn">💾 حفظ المعاينة</div>
        </div>
    </div>

    <div class="info">
        اسحب النيون بإصبعك · قرصتين للتكبير<br>
        جرب أنواع المزج والسطوع عشان تناسب كل صورة نيون
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let bgImg = null;
        let neonImg = null;
        let state = {
    x: 0.5,
    y: 0.5,
    scale: 0.8,
    rotation: 0,
    alpha: 0.95,
    brightness: 1.0,
    contrast: 1.0,
    blend: 'screen',
    flipH: false,
    flipV: false,
    // --- إضافات الواقعية ---
    glow: 0.7,          // شدة الـ Glow
    spill: 0.55,        // انتشار الضوء على الجدار
    spillSize: 1.8,     // حجم انتشار الضوء
    envMix: 0.4         // اندماج مع البيئة
};

        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let startStateX = 0, startStateY = 0;
        let lastPinchDist = 0;
        let initialPinchScale = 0.8;

        // عناصر التحكم
        const scaleSlider = document.getElementById('scaleSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const alphaSlider = document.getElementById('alphaSlider');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const contrastSlider = document.getElementById('contrastSlider');

        const scaleVal = document.getElementById('scaleVal');
        const rotateVal = document.getElementById('rotateVal');
        const alphaVal = document.getElementById('alphaVal');
        const brightnessVal = document.getElementById('brightnessVal');
        const contrastVal = document.getElementById('contrastVal');

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function draw() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // الخلفية
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, w, h);
            } else {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#555';
                ctx.font = '17px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('حمّل صورة المحل', w/2, h/2 - 12);
                ctx.fillText('ثم صورة النيون', w/2, h/2 + 18);
            }

            // النيون
            if (neonImg) {
                const cx = state.x * w;
                const cy = state.y * h;
                const baseSize = Math.min(w, h) * 0.42;
                const size = baseSize * state.scale;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((state.rotation * Math.PI) / 180);

                // القلب
                const scaleX = state.flipH ? -1 : 1;
                const scaleY = state.flipV ? -1 : 1;
                ctx.scale(scaleX, scaleY);

                // الفلتر (سطوع + تباين)
                ctx.filter = `brightness(\( {state.brightness}) contrast( \){state.contrast})`;
                ctx.globalAlpha = state.alpha;
                ctx.globalCompositeOperation = state.blend;

                ctx.drawImage(neonImg, -size/2, -size/2, size, size);

                ctx.restore();

                // إعادة الضبط
                ctx.filter = 'none';
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
            }
        }

        function loadImage(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => callback(img);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('bgInput').addEventListener('change', (e) => {
            loadImage(e.target.files[0], (img) => {
                bgImg = img;
                fitCanvasToImage();
                draw();
            });
        });

        document.getElementById('neonInput').addEventListener('change', (e) => {
            loadImage(e.target.files[0], (img) => {
                neonImg = img;
                fitCanvasToImage();
                draw();
            });
        });

        function fitCanvasToImage() {
            const wrapper = canvas.parentElement;
            const w = wrapper.getBoundingClientRect().width - 4;
            let imgRatio = 4/3;
            if (bgImg) imgRatio = bgImg.width / bgImg.height;
            else if (neonImg) imgRatio = neonImg.width / neonImg.height;

            const dpr = 2.5; // جودة أعلى
            canvas.width = w * dpr;
            canvas.height = (w / imgRatio) * dpr;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
        }

        // السلايدرات
        scaleSlider.addEventListener('input', () => {
            state.scale = parseFloat(scaleSlider.value);
            scaleVal.textContent = state.scale.toFixed(2);
            draw();
        });
        rotateSlider.addEventListener('input', () => {
            state.rotation = parseFloat(rotateSlider.value);
            rotateVal.textContent = state.rotation + '°';
            draw();
        });
        alphaSlider.addEventListener('input', () => {
            state.alpha = parseFloat(alphaSlider.value);
            alphaVal.textContent = state.alpha.toFixed(2);
            draw();
        });
        brightnessSlider.addEventListener('input', () => {
            state.brightness = parseFloat(brightnessSlider.value);
            brightnessVal.textContent = state.brightness.toFixed(2);
            draw();
        });
        contrastSlider.addEventListener('input', () => {
            state.contrast = parseFloat(contrastSlider.value);
            contrastVal.textContent = state.contrast.toFixed(2);
            draw();
        });

        // أزرار المزج
        document.querySelectorAll('.blend-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.blend-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.blend = btn.dataset.blend;
                draw();
            });
        });

        // أزرار القلب
        document.getElementById('flipH').addEventListener('click', function() {
            state.flipH = !state.flipH;
            this.classList.toggle('active');
            draw();
        });
        document.getElementById('flipV').addEventListener('click', function() {
            state.flipV = !state.flipV;
            this.classList.toggle('active');
            draw();
        });

        // إعادة التعيين
        document.getElementById('resetBtn').addEventListener('click', () => {
            state = {
                x: 0.5, y: 0.5, scale: 0.8, rotation: 0,
                alpha: 0.95, brightness: 1.0, contrast: 1.0,
                blend: 'screen', flipH: false, flipV: false
            };
            scaleSlider.value = 0.8;
            rotateSlider.value = 0;
            alphaSlider.value = 0.95;
            brightnessSlider.value = 1.0;
            contrastSlider.value = 1.0;
            scaleVal.textContent = '0.80';
            rotateVal.textContent = '0°';
            alphaVal.textContent = '0.95';
            brightnessVal.textContent = '1.00';
            contrastVal.textContent = '1.00';

            document.querySelectorAll('.blend-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.blend-btn[data-blend="screen"]').classList.add('active');
            document.getElementById('flipH').classList.remove('active');
            document.getElementById('flipV').classList.remove('active');
            draw();
        });

        // حفظ بجودة عالية
        document.getElementById('saveBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'neon_preview_' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });

        // أحداث اللمس والسحب
        function getEventPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
            }
            return { clientX: e.clientX, clientY: e.clientY };
        }

        function getTouchDist(e) {
            if (!e.touches || e.touches.length < 2) return 0;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function handleStart(e) {
            e.preventDefault();
            if (e.touches && e.touches.length === 2) {
                lastPinchDist = getTouchDist(e);
                initialPinchScale = state.scale;
                return;
            }
            const pos = getEventPos(e);
            const cx = state.x * canvas.width;
            const cy = state.y * canvas.height;
            const size = Math.min(canvas.width, canvas.height) * 0.42 * state.scale;
            const canvasPos = getCanvasCoords(pos.clientX, pos.clientY);
            const dist = Math.hypot(canvasPos.x - cx, canvasPos.y - cy);

            if (dist < size / 2 + 50 || !bgImg) {
                isDragging = true;
                dragStartX = pos.clientX;
                dragStartY = pos.clientY;
                startStateX = state.x;
                startStateY = state.y;
            }
        }

        function handleMove(e) {
    if (isDragging || (e.touches && e.touches.length === 2)) {
        e.preventDefault();
    }
            if (e.touches && e.touches.length === 2 && neonImg) {
                const newDist = getTouchDist(e);
                if (lastPinchDist > 0) {
                    let newScale = initialPinchScale * (newDist / lastPinchDist);
                    newScale = Math.min(2.5, Math.max(0.15, newScale));
                    state.scale = newScale;
                    scaleSlider.value = newScale;
                    scaleVal.textContent = newScale.toFixed(2);
                    draw();
                }
                return;
            }
            if (!isDragging || !neonImg) return;
            const pos = getEventPos(e);
            const rect = canvas.getBoundingClientRect();
            state.x = Math.min(1, Math.max(0, startStateX + (pos.clientX - dragStartX) / rect.width));
            state.y = Math.min(1, Math.max(0, startStateY + (pos.clientY - dragStartY) / rect.height));
            draw();
        }

        function handleEnd() {
            isDragging = false;
            lastPinchDist = 0;
        }

        canvas.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
canvas.addEventListener('touchend', handleEnd, { passive: false });
window.addEventListener('touchend', handleEnd, { passive: false });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        setTimeout(() => { fitCanvasToImage(); draw(); }, 120);
        window.addEventListener('resize', () => { fitCanvasToImage(); draw(); });
    </script>
</body>
</html>
